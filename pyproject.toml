[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qbouncer"
version = "1.2.0"
description = "WireGuard NAT-PMP Port Bouncer for qBittorrent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vegard Hansen"}
]
dependencies = [
    "requests>=2.33.0",
    "tomli>=2.2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.15.0",
    "mypy>=1.18.0",
    "ruff>=0.15.0",
    "types-requests>=2.33.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
qbouncer = "qbouncer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
